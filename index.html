<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3a3a3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>週間バーチカル手帳</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="toolbar">
    <div class="nav">
      <button id="btn-prev" class="icon-btn" aria-label="前へ">‹</button>
      <button id="btn-today" class="text-btn">今日</button>
      <button id="btn-next" class="icon-btn" aria-label="次へ">›</button>
      <h1 id="title" class="title"></h1>
    </div>
    <div class="actions">
      <div class="seg" role="tablist">
        <button id="tab-week" class="seg-btn active" role="tab">週間</button>
        <button id="tab-month" class="seg-btn" role="tab">月間</button>
      </div>
      <button id="btn-sync" class="text-btn" title="Googleカレンダーと同期">⟳ 同期</button>
      <button id="btn-settings" class="icon-btn" aria-label="設定">⚙</button>
    </div>
  </header>

  <main id="view"></main>
  <div id="status" class="status" hidden></div>

  <!-- 予定ダイアログ -->
  <dialog id="event-dialog">
    <form id="event-form" method="dialog">
      <h2 id="event-dialog-title">予定</h2>
      <label>タイトル<input name="title" required autocomplete="off"></label>
      <label class="row"><input type="checkbox" name="allDay"> 終日</label>
      <div class="row times">
        <label>開始日<input type="date" name="date" required></label>
        <label>終了日<input type="date" name="endDate" required></label>
      </div>
      <div class="row times">
        <label>開始<input type="time" name="start" step="300"></label>
        <label>終了<input type="time" name="end" step="300"></label>
      </div>
      <label>メモ<textarea name="description" rows="3"></textarea></label>
      <p class="hint" id="event-source"></p>
      <div class="dialog-actions">
        <button type="button" id="btn-event-delete" class="danger">削除</button>
        <span class="spacer"></span>
        <button type="button" id="btn-event-cancel">キャンセル</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 設定ダイアログ -->
  <dialog id="settings-dialog">
    <form id="settings-form" method="dialog">
      <h2>設定</h2>
      <label>Google OAuth クライアントID
        <input name="clientId" placeholder="xxxxx.apps.googleusercontent.com" autocomplete="off">
      </label>
      <label>カレンダーID
        <input name="calendarId" placeholder="primary" autocomplete="off">
      </label>
      <p class="hint">Google Cloud Console で「ウェブアプリケーション」の OAuth クライアントを作成し、このアプリのURLを「承認済みの JavaScript 生成元」に登録してください。詳細は README を参照。</p>
      <p class="hint" id="google-state"></p>
      <div class="dialog-actions">
        <button type="button" id="btn-google-signout" class="danger">連携解除</button>
        <span class="spacer"></span>
        <button type="button" id="btn-settings-cancel">閉じる</button>
        <button type="submit" class="primary">保存して連携</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
