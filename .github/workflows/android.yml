name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk vertical-techo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vertical-techo-apk
          path: android/vertical-techo.apk
          if-no-files-found: error

      # スマホから .apk を直接ダウンロードできるよう、Releases に最新版を置く
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: 最新APK（バーチカル手帳）
          body: |
            スマホでこのページを開き、下の Assets にある `vertical-techo.apk` をタップしてダウンロード・インストールしてください。
            ビルド元コミット: ${{ github.sha }}
          prerelease: true
          files: android/vertical-techo.apk
